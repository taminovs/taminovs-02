name: Enhance navigation

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Style navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* NAV ENHANCEMENT */'
          if marker in s:
              raise SystemExit(0)
          css = '''<style>/* NAV ENHANCEMENT */
          nav{height:78px!important;padding:0 5.5vw!important;background:linear-gradient(180deg,rgba(5,5,7,.9),rgba(5,5,7,.62))!important;border-bottom:1px solid rgba(155,92,255,.1)!important;box-shadow:0 8px 40px rgba(0,0,0,.18),inset 0 -1px 0 rgba(255,255,255,.025);animation:navDrop .9s cubic-bezier(.2,.8,.2,1) both}
          nav:before{content:"";position:absolute;left:0;bottom:-1px;width:22%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);filter:blur(.3px);animation:navScan 5s ease-in-out infinite}
          .logo{position:relative;font-size:15px!important;letter-spacing:.18em!important;text-shadow:0 0 18px rgba(155,92,255,0);transition:transform .35s ease,color .35s ease,text-shadow .35s ease}
          .logo:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:1px;background:linear-gradient(90deg,var(--accent),transparent);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
          .logo:hover{transform:translateY(-1px);color:#fff;text-shadow:0 0 22px rgba(155,92,255,.55)}.logo:hover:after{transform:scaleX(1)}
          .navlinks{gap:34px!important}
          .navlinks a{position:relative;padding:10px 0;color:#777783!important;transition:color .3s ease,transform .3s ease,text-shadow .3s ease;animation:navItem .7s cubic-bezier(.2,.8,.2,1) both}
          .navlinks a:nth-child(1){animation-delay:.12s}.navlinks a:nth-child(2){animation-delay:.18s}.navlinks a:nth-child(3){animation-delay:.24s}.navlinks a:nth-child(4){animation-delay:.3s}
          .navlinks a:before{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:center;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(155,92,255,.5)}
          .navlinks a:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#bca0ff;opacity:0;transform:translate(-50%,-50%) scale(.2);transition:.35s;filter:blur(.2px);box-shadow:0 0 14px 4px rgba(155,92,255,.35)}
          .navlinks a:hover,.navlinks a.active{color:#fff!important;transform:translateY(-2px);text-shadow:0 0 16px rgba(255,255,255,.18)}
          .navlinks a:hover:before,.navlinks a.active:before{transform:scaleX(1)}.navlinks a:hover:after{opacity:.8;transform:translate(-50%,-50%) scale(1)}
          @keyframes navDrop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}@keyframes navItem{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@keyframes navScan{0%,100%{left:-22%;opacity:0}15%{opacity:1}50%{left:100%;opacity:.7}70%{opacity:0}}
          @media(max-width:760px){nav{height:64px!important;padding:0 20px!important}.navlinks{gap:15px!important}.navlinks a{font-size:9px!important}.logo{font-size:13px!important}}
          @media(prefers-reduced-motion:reduce){nav,.navlinks a{animation:none!important}.navlinks a:before,.navlinks a:after{transition:none!important}}
          </style>'''
          s = s.replace('</head>', css + '</head>', 1)
          js = '''<script>/* NAV ACTIVE STATE */
          const navLinks=[...document.querySelectorAll('.navlinks a')];
          const navSections=navLinks.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
          const navObs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){navLinks.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id))}})},{rootMargin:'-35% 0px -55% 0px',threshold:0});
          navSections.forEach(s=>navObs.observe(s));
          </script>'''
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Style and animate top navigation"
          git push
