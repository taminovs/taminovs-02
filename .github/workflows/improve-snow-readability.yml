name: Improve snow readability

on:
  push:
    branches: [main]

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve block readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</head>'
          css='''<style>\n/* SNOW READABILITY */\n.card,.info,.merch-pack,.contactbox{background:linear-gradient(145deg,rgba(5,5,9,.88),rgba(8,7,14,.82))!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(178,143,255,.24)!important}\n.card h3,.card p,.info h4,.info p,.pack-title,.pack-status,.pack-num,.contactbox{position:relative;z-index:2}\n.hero .intro,.section-head,.merch-content,.contacts{position:relative;z-index:2}\n.merch-pack:before{z-index:1}\n</style>\n'''
          if '/* SNOW READABILITY */' not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Improve text block readability over snow' && git push)
